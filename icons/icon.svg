<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="m1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="m2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />

  <!-- Stopwatch Ring outer subtle glow -->
  <circle cx="256" cy="270" r="195" fill="none" stroke="#f59e0b" stroke-width="12" stroke-opacity="0.8" stroke-dasharray="8 6" />

  <!-- Stopwatch Crown Button at Top -->
  <rect x="236" y="44" width="40" height="26" rx="6" fill="#f59e0b" />
  <rect x="246" y="70" width="20" height="12" fill="#d97706" />

  <!-- Sun -->
  <circle cx="350" cy="180" r="42" fill="#fbbf24" />

  <!-- Back Mountain -->
  <polygon points="60,420 190,210 330,420" fill="url(#m1)" />
  <!-- Front Mountain -->
  <polygon points="170,420 310,240 460,420" fill="url(#m2)" />

  <!-- Snow Caps -->
  <polygon points="190,210 165,250 185,245 205,255 215,250" fill="#f8fafc" opacity="0.9" />
  <polygon points="310,240 280,280 305,275 325,285 340,280" fill="#f8fafc" opacity="0.9" />

  <!-- Winding Trail Line -->
  <path d="M 230,460 C 270,410 190,370 250,330 C 280,310 260,290 280,275" fill="none" stroke="#fef08a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Runner / Stopwatch hand indicator -->
  <circle cx="256" cy="270" r="10" fill="#f59e0b" />
  <line x1="256" y1="270" x2="256" y2="120" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
</svg>

